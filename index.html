<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MetaCurtis Premium WebGL</title>

    <!-- Critical hero CSS inlined for instant LCP -->
    <style>
      .hero-heading-wrapper { min-height: 5rem; overflow: hidden; }
      h2 { font-size:2.5rem; line-height:1.2; margin-bottom:1rem; opacity:1; }
    </style>

    <!-- Preload & load your Inter font -->
    <link rel="preload"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
          as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
          rel="stylesheet">

    <!-- Minimal instant loader -->
    <style>
      #instant-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #00ff88;
        font-family: "Courier New", Courier, monospace;
        letter-spacing: 0.1em;
        z-index: 9999;
        transition: opacity 180ms ease;
      }

      #instant-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>

    <!-- Main CSS bundle -->
    <link rel="stylesheet" href="/src/styles/index.css" />

    <!-- Meta tags -->
    <meta name="description"
          content="MetaCurtis V3.1—high-performance WebGL site with interactive particles and smooth animations" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
  </head>

  <body>
    <div id="instant-loader">
      <div>LOADING...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
