name: AI Patch Queue

on:
  push:
    paths:
      - ".ai-queue/**/*.patch"

permissions:
  contents: write          # so the workflow can push branches
  pull-requests: write     # so gh pr create works

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (prod only)
        run: npm ci --ignore-scripts

      - name: Apply next AI patch
        run: node scripts/apply-ai-patch.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # picked up by gh CLI
