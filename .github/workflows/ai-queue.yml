name: AI Patch Queue


permissions:
  contents: write        # allow push / branch delete
  pull-requests: write
  
on:
  push:
    paths:
      - ".ai-queue/**/*.patch"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Node 20.x ⇢ required by eslint 9 / vite‑plugin‑glsl
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      # the script itself installs deps inside the work‑tree
      - run: node scripts/apply-ai-patch.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
