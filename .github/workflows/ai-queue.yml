name: AI Patch Queue
on:
  push:
    paths:
      - ".ai-queue/**/*.patch"
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '18', cache: 'npm' }
      - run: npm ci --ignore-scripts
      - run: node scripts/apply-ai-patch.cjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

